name: Android APK

on:
  push:
    branches: [main, emreview-dev, emreview-dev-fix]
  pull_request:
    branches: [main, emreview-dev, emreview-dev-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint and unit tests
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest

      - name: Build optimized signed release APKs and AAB
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -gt 0

          apksigner_path=""
          while IFS= read -r candidate; do
            apksigner_path="$candidate"
            break
          done < <(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V)

          test -n "$apksigner_path"

          for apk in "${apks[@]}"; do
            echo "=== $apk ==="
            test -s "$apk"
            unzip -t "$apk" >/dev/null
            "$apksigner_path" verify --verbose "$apk"
            du -h "$apk"
          done

          if find app/build/outputs/apk/release -type f -name '*.apk' -print0 | xargs -0 unzip -l 2>/dev/null | grep -E 'robolectric|robolectric-nativeruntime|sqlite4java|com/ibm/icu|^.*fonts/'; then
            echo "ERROR: test/runtime resources leaked into the release APK."
            exit 1
          fi

          test -s app/build/outputs/bundle/release/app-release.aab
          echo "AAB:"
          du -h app/build/outputs/bundle/release/app-release.aab

      - name: Upload optimized release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emreview-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
