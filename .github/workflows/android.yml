name: Android APK

on:
  push:
    branches: [main, emreview-dev, emreview-dev-fix]
  pull_request:
    branches: [main, emreview-dev, emreview-dev-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check project
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest

      - name: Build optimized release APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APKs and print sizes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            echo "=== ${apk} ==="
            test -s "${apk}"
            unzip -t "${apk}" >/dev/null
            file "${apk}"
            du -h "${apk}"
          done

          if find app/build/outputs/apk/release -type f -name '*.apk' -print0 | xargs -0 unzip -l 2>/dev/null | grep -E 'robolectric|robolectric-nativeruntime|sqlite4java|com/ibm/icu|fonts/'; then
            echo "ERROR: test/runtime resources leaked into the release APK."
            exit 1
          fi

      - name: Upload optimized release APKs
        uses: actions/upload-artifact@v4
        with:
          name: emreview-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
